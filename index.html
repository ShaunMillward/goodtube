<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Feed</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Feed">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14181f">
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#14181f;--mute:#667085;--line:#dde2e8;--acc:#0f766e;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#14181f;--card:#1c222b;--ink:#eef1f5;--mute:#98a2b3;--line:#2b3340;--acc:#5eead4}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,sans-serif}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html.lock,html.lock body{overflow:hidden}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1{font-size:20px;margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:8px;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.bar button{color:var(--acc);font-weight:600}
main{max-width:640px;margin:0 auto;padding:12px 16px 40px}
.v{display:block;width:100%;text-align:left;padding:0;margin:0 0 20px}
.th{position:relative;border-radius:10px;overflow:hidden;background:var(--line)}
.th img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.th i{position:absolute;left:0;bottom:0;height:4px;background:var(--acc)}
.v .t{margin:8px 2px 0;font-weight:600}
.v .m{margin:2px 2px 0;color:var(--mute);font-size:14px}
.v.seen{opacity:.45}
.empty,.err{color:var(--mute);padding:32px 0;text-align:center}
.err{color:#b42318}
#player{position:fixed;top:0;left:0;right:0;height:100dvh;background:#000;z-index:20;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);overscroll-behavior:none}
#player.on{display:flex}
#player .top{display:flex;justify-content:space-between;color:#fff;padding:4px 8px}
#player button{color:#fff}
#speed{font:inherit;color:#fff;background:#222;border:1px solid #444;border-radius:8px;padding:4px 8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);background:#222;color:#fff;border-radius:20px;padding:8px 16px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast{border:0;font:inherit;font-size:14px;max-width:calc(100% - 32px)}
#toast.on{opacity:1;pointer-events:auto}
#player .top{align-items:center;gap:4px}
#player .top button{font-size:15px;padding:8px 6px}
#slot{width:100%;aspect-ratio:16/9;background:#000}
#slot iframe{width:100%;height:100%;border:0;display:block}
#panel{position:fixed;inset:0;background:var(--bg);z-index:15;display:none;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 40px}
#panel.on{display:block}
#panel .in{max-width:640px;margin:0 auto}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row button{color:#b42318}
input{font:inherit;width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.add{display:flex;gap:8px;margin:16px 0}
.add button{background:var(--acc);color:var(--bg);border-radius:8px;font-weight:600;padding:8px 16px}
</style>
</head>
<body>
<header class="bar">
  <h1>Feed</h1>
  <span><button id="refresh">Refresh</button><button id="edit">Channels</button></span>
</header>
<main id="list"></main>

<div id="player">
  <div class="top"><button id="close">Close</button><select id="speed" aria-label="Playback speed"><option>1</option><option>1.25</option><option>1.5</option><option>1.75</option><option>2</option></select><button id="skipBtn">Skip: On</button><button id="toggle">Mark watched</button></div>
  <div id="slot"></div>
  <button id="toast"></button>
</div>

<div id="panel"><div class="in">
  <div class="bar" style="display:flex;justify-content:space-between;align-items:center"><h1>Channels</h1><button id="done">Done</button></div>
  <div class="add"><input id="handle" placeholder="@handle or channel ID (UC…)" autocapitalize="off" autocorrect="off"><button id="addBtn">Add</button></div>
  <div id="msg" class="err" style="padding:0 0 8px;text-align:left"></div>
  <div id="chans"></div>
</div></div>

<script>
// Paste your Worker URL here (no trailing slash).
const API = "https://late-mountain-f304.shaun-millward.workers.dev";

const $ = id => document.getElementById(id);
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

let channels = load("channels", []);   // [{id, name}]
let seen = load("seen", {});           // {videoId: 1}  finished or marked watched
let progress = load("progress", {});   // {videoId: {t, d}}  partly watched
let videos = load("videos", []);
let speed = load("speed", 1.25);
let segs = [], skipTimer = null, toastT = null, declined = new Set(), lastSkip = null, skipOn = load("skipOn", true);
let current = null, player = null, timer = null, ytReady = null;

const ago = d => {
  const s = (Date.now() - new Date(d)) / 1000;
  for (const [n, u] of [[86400*365,"year"],[86400*30,"month"],[86400*7,"week"],[86400,"day"],[3600,"hour"],[60,"minute"]])
    if (s >= n) { const c = Math.floor(s / n); return `${c} ${u}${c > 1 ? "s" : ""} ago`; }
  return "just now";
};

function render(error) {
  const y = window.scrollY; // keep your place in the list
  const el = $("list");
  el.textContent = "";
  if (error) { const e = document.createElement("div"); e.className = "err"; e.textContent = error; el.append(e); }
  if (!channels.length) {
    const e = document.createElement("div"); e.className = "empty";
    e.textContent = "No channels yet. Tap Channels to add one."; el.append(e); return;
  }
  for (const v of videos) {
    const b = document.createElement("button");
    b.className = "v" + (seen[v.id] ? " seen" : "");
    const th = document.createElement("div"); th.className = "th";
    const img = document.createElement("img");
    img.loading = "lazy"; img.alt = ""; img.src = `https://i.ytimg.com/vi/${v.id}/mqdefault.jpg`;
    th.append(img);
    const p = progress[v.id];
    if (p && !seen[v.id]) { const bar = document.createElement("i"); bar.style.width = Math.min(100, p.t / p.d * 100) + "%"; th.append(bar); }
    const t = document.createElement("div"); t.className = "t"; t.textContent = v.title;
    const m = document.createElement("div"); m.className = "m"; m.textContent = `${v.author} • ${ago(v.published)}`;
    b.append(th, t, m);
    b.onclick = () => play(v);
    el.append(b);
  }
  window.scrollTo(0, y);
}

async function refresh() {
  if (!channels.length) return render();
  $("refresh").textContent = "Loading…";
  try {
    const results = await Promise.allSettled(channels.map(async c => {
      const r = await fetch(`${API}/feed?id=${c.id}`);
      if (!r.ok) throw new Error(c.name);
      const xml = new DOMParser().parseFromString(await r.text(), "text/xml");
      return [...xml.getElementsByTagName("entry")].map(e => ({
        id: e.getElementsByTagName("yt:videoId")[0].textContent,
        title: e.getElementsByTagName("title")[0].textContent,
        published: e.getElementsByTagName("published")[0].textContent,
        author: c.name,
      }));
    }));
    const ok = results.filter(r => r.status === "fulfilled").flatMap(r => r.value);
    const failed = results.filter(r => r.status === "rejected").length;
    if (ok.length) {
      videos = ok.sort((a, b) => new Date(b.published) - new Date(a.published)).slice(0, 80);
      save("videos", videos);
    }
    render(failed ? `${failed} channel${failed > 1 ? "s" : ""} failed to load.` : "");
  } catch { render("Could not reach the feed. Showing the last saved list."); }
  $("refresh").textContent = "Refresh";
}

// ---- Player with progress tracking (YouTube IFrame API) ----
function loadYT() {
  if (ytReady) return ytReady;
  ytReady = new Promise((res, rej) => {
    if (window.YT && YT.Player) return res();
    window.onYouTubeIframeAPIReady = res;
    const s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api"; s.onerror = () => { ytReady = null; rej(); };
    document.head.append(s);
  });
  return ytReady;
}

// ---- SponsorBlock: skip sponsor reads, self-promo and subscribe reminders ----
async function getSegs(id) {
  segs = []; declined = new Set();
  try {
    const hash = [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(id)))]
      .map(b => b.toString(16).padStart(2, "0")).join("").slice(0, 4); // only a 4-char prefix is sent
    const cats = encodeURIComponent('["sponsor","selfpromo","interaction"]');
    const r = await fetch(`https://sponsor.ajay.app/api/skipSegments/${hash}?categories=${cats}`);
    if (!r.ok) return;
    const hit = (await r.json()).find(x => x.videoID === id);
    if (hit && current && current.id === id) segs = hit.segments.map(s => s.segment);
  } catch {}
}
function toast(msg, ms = 2000) {
  const t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), ms);
}
function skipCheck() {
  if (!skipOn || !player || !player.getCurrentTime || !segs.length) return;
  const t = player.getCurrentTime(), M = 3; // keep a 3s margin at each end in case a segment is marked badly
  for (let i = 0; i < segs.length; i++) {
    const from = segs[i][0] + M, to = segs[i][1] - M;
    if (to - from < 2 || declined.has(i)) continue;
    if (t >= from && t < to - 0.5) {
      lastSkip = { t, i }; player.seekTo(to, true);
      toast(`Skipped ${Math.round(to - t)}s · tap to go back`, 6000); break;
    }
  }
}

function updateToggle() { $("toggle").textContent = seen[current.id] ? "Mark unwatched" : "Mark watched"; }

async function play(v) {
  current = v;
  $("player").classList.add("on");
  document.documentElement.classList.add("lock");
  updateToggle();
  getSegs(v.id);
  const slot = $("slot"); slot.innerHTML = '<div id="yt"></div>';
  const start = !seen[v.id] && progress[v.id] ? Math.max(0, Math.floor(progress[v.id].t) - 3) : 0;
  try {
    await loadYT();
    player = new YT.Player("yt", {
      host: "https://www.youtube-nocookie.com",
      width: "100%", height: "100%", videoId: v.id,
      playerVars: { playsinline: 1, rel: 0, autoplay: 1, start, origin: location.origin },
      events: {
        onReady: e => e.target.setPlaybackRate(speed),
        onStateChange: e => {
          if (e.data === 1) { if (e.target.getPlaybackRate() !== speed) e.target.setPlaybackRate(speed); clearInterval(timer); timer = setInterval(saveProgress, 5000); clearInterval(skipTimer); skipTimer = setInterval(skipCheck, 500); }
          else { clearInterval(timer); clearInterval(skipTimer); if (e.data === 2) saveProgress(); }
          if (e.data === 0) { seen[v.id] = 1; delete progress[v.id]; save("seen", seen); save("progress", progress); updateToggle(); }
        },
      },
    });
  } catch {
    // API blocked: plain embed, no progress tracking
    slot.innerHTML = `<iframe allow="autoplay; picture-in-picture; fullscreen" allowfullscreen src="https://www.youtube-nocookie.com/embed/${v.id}?playsinline=1&rel=0&autoplay=1&start=${start}"></iframe>`;
  }
}

function saveProgress() {
  if (!player || !player.getCurrentTime || !current) return;
  const t = player.getCurrentTime(), d = player.getDuration();
  if (!d || !isFinite(t)) return;
  const id = current.id;
  if (t / d >= 0.9 || d - t < 45) { seen[id] = 1; delete progress[id]; }       // effectively finished
  else if (t >= 15) { progress[id] = { t, d }; delete seen[id]; }               // real watching, not a peek
  save("seen", seen); save("progress", progress);
}

function closePlayer(skipSave) {
  if (!skipSave) saveProgress();
  clearInterval(timer); clearInterval(skipTimer); segs = []; declined = new Set(); lastSkip = null; $("toast").classList.remove("on");
  try { player && player.destroy(); } catch {}
  player = null;
  $("slot").textContent = "";
  $("player").classList.remove("on");
  document.documentElement.classList.remove("lock");
  render();
}
$("speed").value = String(speed);
$("speed").onchange = () => { speed = parseFloat($("speed").value); save("speed", speed); if (player && player.setPlaybackRate) player.setPlaybackRate(speed); };
const showSkip = () => { $("skipBtn").textContent = "Skip: " + (skipOn ? "On" : "Off"); };
showSkip();
$("skipBtn").onclick = () => { skipOn = !skipOn; save("skipOn", skipOn); showSkip(); toast(skipOn ? "Sponsor skipping on" : "Sponsor skipping off"); };
$("toast").onclick = () => {
  if (!lastSkip || !player) return;
  declined.add(lastSkip.i); player.seekTo(lastSkip.t, true); lastSkip = null; $("toast").classList.remove("on");
};
$("close").onclick = () => closePlayer();
$("toggle").onclick = () => {
  const id = current.id;
  if (seen[id]) { delete seen[id]; delete progress[id]; } else { seen[id] = 1; delete progress[id]; }
  save("seen", seen); save("progress", progress);
  closePlayer(true);
};
// Save when the app is backgrounded or the screen locks
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { if (player) saveProgress(); }
  else if (!$("player").classList.contains("on")) refresh();
});
addEventListener("pagehide", () => { if (player) saveProgress(); });

// ---- Channels ----
function renderChannels() {
  const box = $("chans"); box.textContent = "";
  for (const c of channels) {
    const row = document.createElement("div"); row.className = "row";
    const n = document.createElement("span"); n.textContent = c.name;
    const b = document.createElement("button"); b.textContent = "Remove";
    b.onclick = () => { channels = channels.filter(x => x.id !== c.id); save("channels", channels); renderChannels(); };
    row.append(n, b); box.append(row);
  }
}
$("edit").onclick = () => { $("panel").classList.add("on"); renderChannels(); };
$("done").onclick = () => {
  $("panel").classList.remove("on");
  videos = videos.filter(v => channels.some(c => c.name === v.author));
  render(); refresh();
};
$("addBtn").onclick = async () => {
  const val = $("handle").value.trim().replace(/\/+$/, ""); if (!val) return;
  $("msg").textContent = "Looking up…";
  try {
    let ch;
    if (/^UC[\w-]{22}$/.test(val)) ch = { id: val, name: val };
    else {
      const r = await fetch(`${API}/resolve?handle=${encodeURIComponent(val)}`);
      if (!r.ok) throw 0;
      ch = await r.json();
    }
    if (!channels.some(c => c.id === ch.id)) channels.push(ch);
    save("channels", channels); $("handle").value = ""; $("msg").textContent = ""; renderChannels();
  } catch { $("msg").textContent = "Couldn't find that channel. Check the handle or paste its UC… ID."; }
};
$("refresh").onclick = refresh;

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
render(); refresh();
</script>
</body>
</html>
